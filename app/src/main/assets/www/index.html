<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>رابطو</title>
<style>
:root{
  --bg:#0b1013; --surface:#131b20; --surface2:#1b262d; --line:#22323b;
  --text:#e8f1f2; --muted:#8ba3ad; --accent:#2ee6a8; --accent-dim:#17b183;
  --mine:#12463a; --bubble:#1b262d; --danger:#ff6b6b; --warn:#ffc46b;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif;
  font-size:15px;overflow:hidden;
  display:flex;flex-direction:column;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}

/* ---------- top bar ---------- */
.bar{
  flex:0 0 auto;padding:14px 16px 10px;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
}
.bar h1{font-size:19px;margin:0;font-weight:650;letter-spacing:-.2px}
.bar .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.bar .grow{flex:1;min-width:0}
.icon{
  width:38px;height:38px;border-radius:12px;background:var(--surface2);
  display:grid;place-items:center;font-size:17px;flex:0 0 auto;
}
.avatar{
  width:44px;height:44px;border-radius:14px;flex:0 0 auto;
  background:linear-gradient(135deg,#1f3a44,#12262e);
  display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--accent);
}
.dot{width:8px;height:8px;border-radius:50%;background:#3c505a;flex:0 0 auto}
.dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}

/* ---------- radio banner ---------- */
.banner{
  margin:10px 12px 0;padding:10px 12px;border-radius:12px;
  background:#2a1f10;border:1px solid #4a3618;color:var(--warn);
  font-size:12.5px;display:none;align-items:center;gap:10px;
}
.banner.show{display:flex}
.banner button{color:var(--accent);font-weight:600;font-size:12.5px}

/* ---------- scroll area ---------- */
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{display:none;padding:8px 0 16px}
.view.on{display:block}

/* ---------- list rows ---------- */
.row{
  display:flex;align-items:center;gap:12px;padding:11px 16px;
}
.row:active{background:var(--surface)}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.row .prev{font-size:12.5px;color:var(--muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:10.5px;color:var(--muted);text-align:left;flex:0 0 auto}
.badge{
  background:var(--accent);color:#04241a;font-size:10.5px;font-weight:700;
  min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px;
}
.empty{padding:48px 32px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.9}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:8px}

/* ---------- chat ---------- */
#chatScroll{padding:14px 12px 8px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:80%;padding:8px 12px 6px;border-radius:14px;background:var(--bubble);
  align-self:flex-start;word-wrap:break-word;position:relative;line-height:1.65}
.msg.mine{background:var(--mine);align-self:flex-end}
.msg .t{font-size:14.5px;white-space:pre-wrap}
.msg .f{font-size:10px;color:var(--muted);margin-top:3px;display:flex;gap:5px;
  justify-content:flex-end;align-items:center}
.msg .who{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px}
.tick{font-size:10.5px}
.tick.read{color:var(--accent)}

/* ---------- composer ---------- */
.composer{
  flex:0 0 auto;display:none;gap:8px;padding:9px 12px;
  background:var(--surface);border-top:1px solid var(--line);align-items:flex-end;
}
.composer.on{display:flex}
.composer textarea{
  flex:1;background:var(--surface2);border:1px solid var(--line);border-radius:20px;
  padding:10px 14px;resize:none;max-height:110px;min-height:42px;outline:none;font-size:15px;
}
.send{
  width:42px;height:42px;border-radius:50%;background:var(--accent);color:#04241a;
  display:grid;place-items:center;font-size:18px;font-weight:700;flex:0 0 auto;
}
.send:disabled{opacity:.35}

/* ---------- tabs ---------- */
nav{
  flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;padding:9px 0 11px;color:var(--muted);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .g{font-size:19px}
nav button.on{color:var(--accent)}

/* ---------- settings ---------- */
.card{margin:10px 12px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden}
.card h3{margin:0;padding:13px 16px 9px;font-size:12px;color:var(--muted);
  font-weight:600;letter-spacing:.3px}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.item .grow{flex:1;min-width:0}
.item .lbl{font-size:14.5px}
.item .hint{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.7}
.item input[type=text]{
  width:100%;background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;outline:none;font-size:14.5px}
.sw{width:46px;height:27px;border-radius:14px;background:#2b3d47;position:relative;
  flex:0 0 auto;transition:background .18s}
.sw i{position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;
  background:#8ba3ad;transition:.18s}
.sw.on{background:var(--accent)}
.sw.on i{right:22px;background:#04241a}
.code{font-family:ui-monospace,monospace;font-size:20px;letter-spacing:3px;
  color:var(--accent);padding:4px 0}
.toast{
  position:fixed;bottom:74px;right:50%;transform:translateX(50%);
  background:#233;border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:9;max-width:88%
}
.toast.on{opacity:1}
</style>
</head>
<body>

<div class="bar">
  <button class="icon" id="back" style="display:none">›</button>
  <div class="avatar" id="topAvatar">…</div>
  <div class="grow">
    <h1 id="title">رابطو</h1>
    <div class="sub" id="subtitle">در حال آماده‌سازی…</div>
  </div>
  <span class="dot" id="netDot"></span>
</div>

<div class="banner" id="banner">
  <span class="grow" id="bannerText"></span>
  <button id="bannerBtn">روشن کن</button>
</div>

<main>
  <section class="view on" id="viewChats"></section>
  <section class="view" id="viewChat"><div id="chatScroll"></div></section>
  <section class="view" id="viewPeople"></section>
  <section class="view" id="viewSettings"></section>
</main>

<div class="composer" id="composer">
  <textarea id="input" rows="1" placeholder="پیام…" enterkeyhint="send"></textarea>
  <button class="send" id="sendBtn" disabled>↑</button>
</div>

<nav>
  <button class="on" data-tab="chats"><span class="g">💬</span>گفتگوها</button>
  <button data-tab="people"><span class="g">👥</span>مخاطبان</button>
  <button data-tab="settings"><span class="g">⚙️</span>تنظیمات</button>
</nav>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ bridge ---
 * The native side exposes exactly one object, `Rabeto`, with a fixed method
 * list. If it is missing we are running in a browser for layout work, so we
 * stub it instead of crashing.
 */
var N = window.Rabeto || {
  api:function(){return 0}, identity:function(){return '{"id":"local","name":"پیش‌نمایش","code":"0000 0000","secure":false}'},
  status:function(){return '{"running":false,"links":0,"peers":[],"bluetooth":false,"wifi":false,"transports":[]}'},
  contacts:function(){return "[]"}, send:function(){return ""}, broadcast:function(){return ""},
  conversation:function(){}, chats:function(){}, markRead:function(){},
  setProfile:function(){}, setFastMode:function(){}, bleEnabled:function(){return false},
  setBleEnabled:function(){}, openRadioSettings:function(){}, vibrate:function(){},
  verificationCode:function(){return ""}
};

var S = {
  me:{id:"",name:"",code:"",secure:false},
  status:{links:0,peers:[],bluetooth:false,wifi:false,transports:[],running:false},
  contacts:{},           // id -> contact
  threads:{},            // peerId -> [messages]
  tab:"chats",
  openPeer:null
};

function $(id){return document.getElementById(id)}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function initials(name,id){
  var n=(name||"").trim();
  if(n) return n.slice(0,2);
  return (id||"؟").slice(0,2);
}
function pad2(n){ n=String(n); return n.length<2 ? "0"+n : n }
function when(ts){
  if(!ts) return "";
  var d=new Date(ts), now=new Date();
  var hm=pad2(d.getHours())+":"+pad2(d.getMinutes());
  if(d.toDateString()===now.toDateString()) return hm;
  return d.toLocaleDateString("fa-IR",{month:"numeric",day:"numeric"});
}
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove("on")},2400);
}
function safeParse(json,fallback){
  try{ return JSON.parse(json) }catch(e){ return fallback }
}

/* ---------------------------------------------------------------- messages --- */

function addMessage(m){
  if(!m || !m.id) return;
  // A broadcast belongs to the broadcast thread no matter who sent it.
  var peer = (m.to==="*") ? "*" : (m.mine ? m.to : m.from);
  if(!S.threads[peer]) S.threads[peer]=[];
  var list=S.threads[peer];
  for(var i=0;i<list.length;i++){ if(list[i].id===m.id){ list[i]=m; return } }
  list.push(m);
  list.sort(function(a,b){return (a.ts||0)-(b.ts||0)});
}

function setStatusOf(id,status){
  for(var p in S.threads){
    var l=S.threads[p];
    for(var i=0;i<l.length;i++) if(l[i].id===id) l[i].status=status;
  }
}

function tickOf(m){
  if(m.draft) return '<span class="tick" title="در انتظار کلید">🕘</span>';
  if(m.status>=3) return '<span class="tick read">✓✓</span>';
  if(m.status>=2) return '<span class="tick">✓✓</span>';
  return '<span class="tick">✓</span>';
}

/* ------------------------------------------------------------------ render --- */

function render(){
  renderBar();
  renderBanner();
  if(S.tab==="chats") renderChats();
  else if(S.tab==="people") renderPeople();
  else if(S.tab==="settings") renderSettings();
  else if(S.tab==="chat") renderChat();
}

function renderBar(){
  var t=$("title"), sub=$("subtitle"), back=$("back"), av=$("topAvatar");

  if(S.tab==="chat"){
    var c=S.contacts[S.openPeer]||{};
    t.textContent = S.openPeer==="*" ? "پیام همگانی" : (c.name||S.openPeer);
    sub.textContent = S.openPeer==="*"
      ? "همه دستگاه‌های اطراف · رمزنگاری نشده"
      : (c.online ? "متصل · رمزنگاری‌شده" : "آفلاین · در صف تحویل");
    back.style.display="grid";
    av.textContent = initials(c.name,S.openPeer);
  }else{
    t.textContent="رابطو";
    var n=S.status.links;
    sub.textContent = n>0 ? (n+" دستگاه در شبکه") :
      (S.status.running ? "در حال جست‌وجوی دستگاه‌ها" : "شبکه متوقف است");
    back.style.display="none";
    av.textContent = initials(S.me.name,S.me.id);
  }
  $("netDot").className = "dot"+(S.status.links>0?" on":"");
  $("composer").className = "composer"+(S.tab==="chat"?" on":"");
}

function renderBanner(){
  var b=$("banner");
  if(!S.status.bluetooth && !S.status.wifi){
    $("bannerText").textContent="بلوتوث و وای‌فای هر دو خاموش‌اند. رابطو راهی برای یافتن کسی ندارد.";
    $("bannerBtn").dataset.radio="bluetooth";
    b.classList.add("show");
  }else if(!S.status.bluetooth){
    $("bannerText").textContent="بلوتوث خاموش است. فعلاً فقط از وای‌فای استفاده می‌شود.";
    $("bannerBtn").dataset.radio="bluetooth";
    b.classList.add("show");
  }else if(!S.status.wifi){
    $("bannerText").textContent="وای‌فای خاموش است. ارسال فایل کند خواهد بود.";
    $("bannerBtn").dataset.radio="wifi";
    b.classList.add("show");
  }else{
    b.classList.remove("show");
  }
}

function renderChats(){
  var v=$("viewChats"), rows=[];
  var peers={};

  for(var p in S.threads){
    var l=S.threads[p];
    if(!l.length) continue;
    peers[p]=l[l.length-1];
  }
  // Online peers with no history yet still deserve a row to tap.
  for(var i=0;i<S.status.peers.length;i++){
    var id=S.status.peers[i].id;
    if(!peers[id]) peers[id]=null;
  }

  var keys=Object.keys(peers).sort(function(a,b){
    var ta=peers[a]?peers[a].ts:0, tb=peers[b]?peers[b].ts:0;
    return tb-ta;
  });

  rows.push(chatRow("*",{name:"پیام همگانی",online:true},
    S.threads["*"]&&S.threads["*"].length?S.threads["*"][S.threads["*"].length-1]:null,"📣"));

  for(var k=0;k<keys.length;k++){
    if(keys[k]==="*") continue;
    var c=S.contacts[keys[k]]||{name:keys[k]};
    rows.push(chatRow(keys[k],c,peers[keys[k]],null));
  }

  if(keys.filter(function(x){return x!=="*"}).length===0){
    rows.push('<div class="empty"><b>هنوز کسی نزدیک نیست</b>'
      +'رابطو بدون اینترنت کار می‌کند، پس یک دستگاه دیگر با رابطو باید در محدوده بلوتوث یا وای‌فای باشد.</div>');
  }
  v.innerHTML=rows.join("");
}

function chatRow(id,c,last,glyph){
  var unread=0;
  var l=S.threads[id]||[];
  for(var i=0;i<l.length;i++) if(!l[i].mine && (l[i].status||0)<3) unread++;

  return '<div class="row" data-peer="'+esc(id)+'">'
    +'<div class="avatar">'+esc(glyph||initials(c.name,id))+'</div>'
    +'<div class="grow"><div class="name">'+esc(c.name||id)
    +(c.online?' <span class="dot on"></span>':'')+'</div>'
    +'<div class="prev">'+(last?esc((last.mine?"شما: ":"")+(last.text||"")):"بدون پیام")+'</div></div>'
    +'<div class="meta">'+(last?when(last.ts):"")
    +(unread?'<div style="margin-top:6px"><span class="badge">'+unread+'</span></div>':'')
    +'</div></div>';
}

function renderPeople(){
  var v=$("viewPeople"), rows=[];
  var ids=Object.keys(S.contacts);

  if(!ids.length){
    v.innerHTML='<div class="empty"><b>مخاطبی ثبت نشده</b>'
      +'هر دستگاهی که رابطو را باز کند و در محدوده باشد، پس از تأیید امضا به‌صورت خودکار اینجا ظاهر می‌شود.</div>';
    return;
  }
  ids.sort(function(a,b){
    var A=S.contacts[a],B=S.contacts[b];
    return (B.online?1:0)-(A.online?1:0);
  });
  for(var i=0;i<ids.length;i++){
    var c=S.contacts[ids[i]];
    rows.push('<div class="row" data-peer="'+esc(ids[i])+'">'
      +'<div class="avatar">'+esc(initials(c.name,ids[i]))+'</div>'
      +'<div class="grow"><div class="name">'+esc(c.name||ids[i])
      +(c.online?' <span class="dot on"></span>':'')+'</div>'
      +'<div class="prev">کد تأیید: '+esc(c.code||"—")+'</div></div>'
      +'<div class="meta">'+(c.keyed?"🔒":"⚠️")+'</div></div>');
  }
  v.innerHTML=rows.join("");
}

function renderChat(){
  var box=$("chatScroll");
  var l=S.threads[S.openPeer]||[];
  var out=[];
  for(var i=0;i<l.length;i++){
    var m=l[i];
    out.push('<div class="msg'+(m.mine?" mine":"")+'">'
      +(S.openPeer==="*"&&!m.mine?'<div class="who">'+esc(m.name||m.from)+'</div>':'')
      +'<div class="t">'+esc(m.text)+'</div>'
      +'<div class="f"><span>'+when(m.ts)+'</span>'+(m.mine?tickOf(m):'')+'</div></div>');
  }
  if(!l.length){
    out.push('<div class="empty">'+(S.openPeer==="*"
      ? "پیام همگانی برای همه دستگاه‌های اطراف خوانا است و رمزنگاری نمی‌شود."
      : "پیام شما رمزنگاری می‌شود. اگر این فرد الان در شبکه نباشد، پیام در صف می‌ماند و به‌محض دیده‌شدن تحویل داده می‌شود.")+'</div>');
  }
  box.innerHTML=out.join("");
  var main=document.querySelector("main");
  main.scrollTop=main.scrollHeight;
}

function renderSettings(){
  var v=$("viewSettings");
  v.innerHTML=
   '<div class="card"><h3>هویت من</h3>'
    +'<div class="item"><div class="avatar">'+esc(initials(S.me.name,S.me.id))+'</div>'
      +'<div class="grow"><input type="text" id="nameInput" value="'+esc(S.me.name)+'" maxlength="48">'
      +'<div class="hint">شناسه: '+esc(S.me.id)+'</div></div></div>'
    +'<div class="item"><div class="grow"><div class="lbl">کد تأیید امنیتی</div>'
      +'<div class="code">'+esc(S.me.code||"—")+'</div>'
      +'<div class="hint">این کد را حضوری با مخاطب مقایسه کنید. اگر یکی بود، هیچ‌کس بین شما نیست.</div>'
      +'</div></div></div>'

   +'<div class="card"><h3>شبکه</h3>'
    +'<div class="item"><div class="grow"><div class="lbl">بلوتوث</div>'
      +'<div class="hint">'+(S.status.bluetooth?"روشن":"خاموش")+'</div></div>'
      +'<button class="icon" data-radio="bluetooth">↗</button></div>'
    +'<div class="item"><div class="grow"><div class="lbl">وای‌فای</div>'
      +'<div class="hint">'+(S.status.wifi?"روشن":"خاموش")+'</div></div>'
      +'<button class="icon" data-radio="wifi">↗</button></div>'
    +'<div class="item"><div class="grow"><div class="lbl">انتقال‌های فعال</div>'
      +'<div class="hint">'+(S.status.transports.length?esc(S.status.transports.join(" · ")):"هیچ‌کدام")+'</div></div></div>'
    +'<div class="item"><div class="grow"><div class="lbl">بلوتوث مستقیم (آزمایشی)</div>'
      +'<div class="hint">بدون نیاز به سرویس‌های گوگل کار می‌کند. روی هر گوشی تست نشده است.</div></div>'
      +'<div class="sw'+(N.bleEnabled()?" on":"")+'" id="bleSw"><i></i></div></div>'
    +'<div class="item"><div class="grow"><div class="lbl">حالت سرعت بالا</div>'
      +'<div class="hint">وای‌فای دایرکت را ترجیح می‌دهد. سریع‌تر ولی شبکه ستاره‌ای می‌شود.</div></div>'
      +'<div class="sw" id="fastSw"><i></i></div></div></div>'

   +'<div class="card"><h3>درباره</h3>'
    +'<div class="item"><div class="grow"><div class="lbl">پروتکل رابطو نسخه '+esc(S.me.protocol||"—")+'</div>'
      +'<div class="hint">این برنامه هیچ مجوز اینترنتی ندارد. حتی اگر بخواهد، نمی‌تواند چیزی به بیرون بفرستد.</div>'
      +'</div></div></div>';

  var f=$("fastSw");
  f.classList.toggle("on", !!S.fast);
}

/* ------------------------------------------------------------------ events --- */

window.RabetoEvent = function(type,payload){
  try{
    if(type==="status"){
      S.status = payload || S.status;
      if(!S.status.peers) S.status.peers=[];
      if(!S.status.transports) S.status.transports=[];
      var online={};
      for(var i=0;i<S.status.peers.length;i++){
        var p=S.status.peers[i];
        online[p.id]=true;
        if(!S.contacts[p.id]) S.contacts[p.id]={id:p.id,name:p.name,keyed:true};
        S.contacts[p.id].name=p.name||S.contacts[p.id].name;
      }
      for(var id in S.contacts) S.contacts[id].online=!!online[id];
      render();
    }
    else if(type==="contacts"){
      var list=payload.contacts||[];
      for(var j=0;j<list.length;j++) S.contacts[list[j].id]=list[j];
      render();
    }
    else if(type==="identity"){ S.me=payload; render(); }
    else if(type==="message"){
      addMessage(payload);
      if(!payload.mine && S.openPeer!==(payload.to==="*"?"*":payload.from)) N.vibrate(30);
      if(S.tab==="chat") renderChat(); else render();
    }
    else if(type==="messageStatus"){
      setStatusOf(payload.id,payload.status);
      if(S.tab==="chat") renderChat();
    }
    else if(type==="conversation"){
      S.threads[payload.peer]=payload.messages||[];
      if(S.tab==="chat"&&S.openPeer===payload.peer) renderChat();
      else render();
    }
    else if(type==="chats"){
      var ms=payload.messages||[];
      for(var k=0;k<ms.length;k++) addMessage(ms[k]);
      render();
    }
    else if(type==="security"){
      var why = payload.reason==="identity_changed"
        ? "کلید امنیتی "+(payload.name||payload.peer)+" عوض شده. تا تأیید حضوری به او پیام ندهید."
        : payload.reason==="session_stale"
          ? "نشست امن با "+(payload.name||payload.peer)+" بازسازی می‌شود."
          : "هویت امن این دستگاه در دسترس نیست.";
      toast(why);
    }
    else if(type==="draftSent"){ N.chats(200); }
    else if(type==="error"){ toast("خطا: "+esc(payload.code)); }
  }catch(e){}
};

window.RabetoBack = function(){
  if(S.tab==="chat"){ go("chats"); return true }
  if(S.tab!=="chats"){ go("chats"); return true }
  return false;   // nothing left to close: let Android background the app
};

/* ---------------------------------------------------------------- actions --- */

function go(tab){
  S.tab=tab;
  document.querySelectorAll(".view").forEach(function(v){v.classList.remove("on")});
  var map={chats:"viewChats",chat:"viewChat",people:"viewPeople",settings:"viewSettings"};
  $(map[tab]).classList.add("on");
  document.querySelectorAll("nav button").forEach(function(b){
    b.classList.toggle("on", b.dataset.tab===tab);
  });
  document.querySelector("main").scrollTop=0;
  render();
}

function openChat(peer){
  S.openPeer=peer;
  S.tab="chat";
  var l=S.threads[peer]||[];
  for(var i=0;i<l.length;i++) if(!l[i].mine && (l[i].status||0)<3) l[i].status=3;
  document.querySelectorAll(".view").forEach(function(v){v.classList.remove("on")});
  $("viewChat").classList.add("on");
  document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("on")});
  N.conversation(peer,300);
  N.markRead(peer);
  render();
}

document.addEventListener("click",function(e){
  if(!e.target || !e.target.closest) return;
  var radio=e.target.closest("[data-radio]");
  if(radio){ N.openRadioSettings(radio.dataset.radio); return }

  var tab=e.target.closest("nav button");
  if(tab){ go(tab.dataset.tab); return }

  if(e.target.closest("#back")){ go("chats"); return }

  var row=e.target.closest("[data-peer]");
  if(row){ openChat(row.dataset.peer); return }

  if(e.target.closest("#bleSw")){
    var on=!N.bleEnabled();
    N.setBleEnabled(on);
    $("bleSw").classList.toggle("on",on);
    toast(on?"بلوتوث مستقیم فعال شد. شبکه بازراه‌اندازی می‌شود.":"بلوتوث مستقیم خاموش شد.");
    return;
  }
  if(e.target.closest("#fastSw")){
    S.fast=!S.fast;
    N.setFastMode(!!S.fast);
    $("fastSw").classList.toggle("on",!!S.fast);
    return;
  }
});

document.addEventListener("change",function(e){
  if(e.target.id==="nameInput"){
    var v=e.target.value.trim();
    if(v){ N.setProfile(v,""); S.me.name=v; toast("نام ذخیره شد"); render() }
  }
});

var input=$("input"), sendBtn=$("sendBtn");
input.addEventListener("input",function(){
  sendBtn.disabled = input.value.trim().length===0;
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,110)+"px";
});
input.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); doSend() }
});
sendBtn.addEventListener("click",doSend);

function doSend(){
  var text=input.value.trim();
  if(!text || !S.openPeer) return;
  var id = S.openPeer==="*" ? N.broadcast(text) : N.send(S.openPeer,text);
  if(!id){
    if(S.openPeer==="*") toast("ارسال Broadcast انجام نشد. وضعیت هویت و اتصال دستگاه را بررسی کنید.");
    else toast("ارسال نشد: هنوز کلید امن این مخاطب دریافت نشده یا نشست امن آماده نیست.");
    return;
  }
  input.value=""; input.style.height="auto"; sendBtn.disabled=true;
}

/* -------------------------------------------------------------------- boot --- */

(function boot(){
  S.me = safeParse(N.identity(),S.me);
  S.status = safeParse(N.status(),S.status);
  var cs = safeParse(N.contacts(),[]);
  for(var i=0;i<cs.length;i++) S.contacts[cs[i].id]=cs[i];
  N.chats(300);
  render();
  setInterval(function(){ S.status = safeParse(N.status(),S.status); renderBar(); renderBanner() },5000);
})();
</script>
